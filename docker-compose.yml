services:
  api:
    build:
      context: ./services/api_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://docintel:docintel@postgres:5432/docintel
      EMBEDDING_BACKEND: auto
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      ENABLE_RERANKER: "true"
      ENABLE_MLFLOW: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5001
      ENABLE_PROMETHEUS: "true"
      INGESTION_MODE: kafka
      ENABLE_KAFKA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_JSON: "true"
      GIT_PYTHON_REFRESH: quiet
    command: >
      sh -c "python -m app.ml.train_classifier &&
             python -m app.ml.train_anomaly &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/app/data
      - ./sample_data:/app/sample_data:ro
    depends_on:
      - postgres
      - redis
      - qdrant
      - mlflow
      - kafka

  # Distributed ingestion worker: consumes document.uploaded events from Kafka.
  worker:
    build:
      context: ./services/api_gateway
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://docintel:docintel@postgres:5432/docintel
      EMBEDDING_BACKEND: auto
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      ENABLE_KAFKA: "true"
      INGESTION_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_JSON: "true"
      GIT_PYTHON_REFRESH: quiet
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/app/data
      - ./sample_data:/app/sample_data:ro
    depends_on:
      - postgres
      - qdrant
      - kafka

  frontend:
    build:
      context: ./frontend/web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.1
    command: mlflow server --host 0.0.0.0 --port 5001
    ports:
      - "5001:5001"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  qdrant_storage:
