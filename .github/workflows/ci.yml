name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (offline backends)
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          EMBEDDING_BACKEND: hashing
          VECTOR_BACKEND: local
          ENABLE_RERANKER: "false"
        run: pytest -q

  model-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal ML deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn joblib pydantic pydantic-settings
      - name: Model-quality gate
        run: python scripts/check_model_quality.py
